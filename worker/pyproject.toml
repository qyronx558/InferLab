[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "inferlab-worker"
version = "0.1.0"
description = "Private, fenced local experiment worker"
requires-python = ">=3.12,<3.13"
dependencies = ["inferlab-core==0.1.0", "inferlab-api==0.1.0"]

[project.scripts]
inferlab-worker = "inferlab_worker.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/inferlab_worker"]
