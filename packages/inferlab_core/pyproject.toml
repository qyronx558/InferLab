[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "inferlab-core"
version = "0.1.0"
description = "InferLab CPU-only metric helpers and benchmark foundations"
requires-python = ">=3.12,<3.13"
dependencies = ["httpx>=0.28.1,<0.29"]

[tool.hatch.build.targets.wheel]
packages = ["src/inferlab_core"]
